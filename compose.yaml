# Snaptie no Jserver — isolado, nada do existente e tocado.
# Porta 3311 (a 3310 e a inpulse2-console). A base vive no stack snaptie-db
# (/opt/snaptie-db), que se alcança pela rede snaptie-db.

services:
  snaptie:
    build:
      context: .
      args:
        DATABASE_URL: ${DATABASE_URL}
        DIRECT_URL: ${DIRECT_URL}
    image: snaptie:latest
    container_name: snaptie
    restart: unless-stopped
    ports:
      - "127.0.0.1:3311:3311"
    env_file: .env.producao
    environment:
      PORT: "3311"
      HOSTNAME: "0.0.0.0"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3311/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
    networks: [default, snaptie-db]

networks:
  snaptie-db:
    external: true
